name: Build Rafiki Assistant APK

on:
  push:
    paths:
      - 'assistant-app/**'
      - '.github/workflows/build-assistant-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build assistant APK
        run: gradle --no-daemon -p assistant-app assembleDebug
      - name: Upload assistant APK
        uses: actions/upload-artifact@v4
        with:
          name: rafiki-assistant-debug-apk
          path: assistant-app/app/build/outputs/apk/debug/app-debug.apk
